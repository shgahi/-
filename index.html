<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منظومة النشاط الطلابي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "IBM Plex Sans Arabic", "Cairo", sans-serif; }
    h1, h2, h3, h4 { font-family: "Cairo", "IBM Plex Sans Arabic", sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app"></div>

  <script>
    const TOKEN_KEY = 'activity_sys_token';
    const ROLE_LABELS = { president: 'رئيس النشاط', vice_president: 'نائب الرئيس', officer: 'ضابط نشاط', member: 'فرد (طالب)' };
    const UNIT_LABELS = { command: 'القيادة العليا', officers: 'لجنة الضباط', activity_1: 'النشاط الأول', activity_2: 'النشاط الثاني', broadcast: 'الإذاعة المدرسية', general: 'النشاط العام', all: 'الجميع' };
    const SUB_STATUS = { pending: ['بانتظار الإدارة', 'text-amber-700'], approved: ['مقبول', 'text-emerald-700'], rejected: ['مرفوض', 'text-red-700'] };
    const CMP_STATUS = { new: ['جديدة', 'text-amber-700'], reviewing: ['قيد المتابعة', 'text-sky-700'], resolved: ['تمت المعالجة', 'text-emerald-700'] };
    const SUG_STATUS = { new: ['جديد', 'text-amber-700'], reviewed: ['تمت المراجعة', 'text-sky-700'], adopted: ['معتمد للتنفيذ', 'text-emerald-700'] };
    const BRC_STATUS = { pending_approval: ['بانتظار الاعتماد', 'text-amber-700'], approved: ['معتمدة للبث', 'text-emerald-700'], aired: ['تم البث', 'text-teal-700'], returned: ['معادة', 'text-red-700'] };

    let state = {
      user: null,
      portalType: 'management',
      tab: 'overview',
      reportTab: 'students',
      subTab: 'achievements',
      data: { users: [], activities: [], broadcasts: [], disciplineLogs: [], directives: [], submissions: [], complaints: [], suggestions: [] },
      selectedBroadcastId: null,
      error: '',
      okMsg: '',
      loading: false,
    };

    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const isMgmt = (r) => ['president', 'vice_president', 'officer'].includes(r);
    const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
    const setToken = (t) => t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY);

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const t = getToken();
      if (t) headers.Authorization = 'Bearer ' + t;
      const res = await fetch(path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'حدث خطأ غير متوقع');
      return data;
    }

    function waUrl(student) {
      let digits = String(student.phone || '').replace(/\D/g, '');
      if (digits.startsWith('05') && digits.length === 10) digits = '966' + digits.slice(1);
      else if (digits.startsWith('5') && digits.length === 9) digits = '966' + digits;
      const approved = state.data.submissions.filter((s) => s.studentId === student.id && s.status === 'approved').length;
      const lines = [
        'السلام عليكم ورحمة الله وبركاته',
        'تقرير أداء الطالب في النشاط الطلابي:',
        'الاسم: ' + student.fullName,
        'القسم: ' + (UNIT_LABELS[student.unit] || student.unit),
        student.gradeOrDept ? 'الصف: ' + student.gradeOrDept : '',
        'مجموع النقاط: ' + (student.points || 0) + ' نقطة',
        'الإنجازات المقبولة: ' + approved,
      ].filter(Boolean).join('\n');
      return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(lines);
    }

    async function refreshWorkspace() {
      state.loading = true;
      render();
      try {
        const [me, ws] = await Promise.all([api('/api/auth/me'), api('/api/workspace')]);
        state.user = me.user;
        state.data = ws;
        if (!state.selectedBroadcastId && ws.broadcasts[0]) state.selectedBroadcastId = ws.broadcasts[0].id;
      } catch (e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
          <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-8 space-y-6">
            <div>
              <p class="text-xs font-semibold text-teal-700">بوابة النشاط الطلابي</p>
              <h1 class="text-2xl font-bold text-slate-900 mt-1">تسجيل الدخول بالرمز</h1>
              <p class="text-sm text-slate-500 mt-1">اختر بوابة الدخول ثم أدخل الرمز السري المخصص لك</p>
            </div>
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">
              <button onclick="setPortal('management')" class="py-2 rounded-lg text-xs font-bold ${state.portalType === 'management' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">دخول الإدارة</button>
              <button onclick="setPortal('member')" class="py-2 rounded-lg text-xs font-bold ${state.portalType === 'member' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">دخول الأفراد (الطلاب)</button>
            </div>
            ${state.error ? `<div class="p-3 rounded-lg bg-red-50 border border-red-200 text-xs font-semibold text-red-700">${esc(state.error)}</div>` : ''}
            <form onsubmit="submitLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">رمز الدخول</label>
                <input id="loginCodeInput" type="password" inputmode="numeric" required placeholder="أدخل الرمز المكون من 6 أرقام" class="w-full h-11 px-4 rounded-xl border border-slate-300 text-center font-mono text-base tracking-widest focus:outline-none focus:border-teal-700" />
              </div>
              <button type="submit" class="w-full h-11 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-sm font-bold">دخول للمنظومة</button>
            </form>
            <p class="text-xs text-slate-500 border-t border-slate-200 pt-4">يتم إضافة حسابات الطلاب وإصدار رموزهم من قِبل الإدارة فقط.</p>
          </div>
        </div>
      `;
    }

    function navItemsFor(user) {
      if (isMgmt(user.role)) {
        return [
          { id: 'overview', label: 'لوحة القيادة' },
          { id: 'reports', label: 'التقارير' },
          { id: 'broadcasts', label: 'الإذاعة' },
          { id: 'directory', label: 'الأفراد والصلاحيات' },
          { id: 'submissions', label: 'تقديم طلاب النشاط' },
        ];
      }
      return [
        { id: 'member_stats', label: 'إحصائياتي' },
        { id: 'member_achievements', label: 'تقديم إنجاز' },
        { id: 'member_complaints', label: 'تقديم شكوى' },
        { id: 'member_suggestions', label: 'الاقتراحات' },
        { id: 'broadcasts', label: 'الإذاعة' },
      ];
    }

    function renderOverview() {
      const students = state.data.users.filter((u) => u.role === 'member');
      const pendingSub = state.data.submissions.filter((s) => s.status === 'pending').length;
      const openCmp = state.data.complaints.filter((c) => c.status !== 'resolved').length;
      const newSug = state.data.suggestions.filter((s) => s.status === 'new').length;
      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-bold">مرحباً، ${esc(state.user.fullName)}</h2>
            <p class="text-sm text-slate-500">${esc(ROLE_LABELS[state.user.role])} · ${esc(UNIT_LABELS[state.user.unit] || '')}</p>
          </div>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <button onclick="setTab('directory')" class="text-right bg-white border border-slate-200 rounded-xl p-5 hover:border-slate-300">
              <div class="text-xs text-slate-500">الطلاب المسجلون</div>
              <div class="text-2xl font-bold font-mono tabular-nums mt-2">${students.length}</div>
            </button>
            <button onclick="setTab('submissions')" class="text-right bg-white border border-slate-200 rounded-xl p-5 hover:border-slate-300">
              <div class="text-xs text-slate-500">إنجازات بانتظار المراجعة</div>
              <div class="text-2xl font-bold text-amber-700 font-mono tabular-nums mt-2">${pendingSub}</div>
            </button>
            <button onclick="setTab('submissions')" class="text-right bg-white border border-slate-200 rounded-xl p-5 hover:border-slate-300">
              <div class="text-xs text-slate-500">شكاوى واقتراحات</div>
              <div class="text-2xl font-bold font-mono tabular-nums mt-2">${openCmp + newSug}</div>
            </button>
            <button onclick="setTab('broadcasts')" class="text-right bg-white border border-slate-200 rounded-xl p-5 hover:border-slate-300">
              <div class="text-xs text-slate-500">الإذاعات المدرسية</div>
              <div class="text-2xl font-bold font-mono tabular-nums mt-2">${state.data.broadcasts.length}</div>
            </button>
          </div>
          <section class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
            <h3 class="text-base font-bold">التوجيهات والتنبيهات</h3>
            <form onsubmit="createDirective(event)" class="grid grid-cols-1 md:grid-cols-3 gap-2">
              <input id="dirTitle" required placeholder="عنوان التنبيه" class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
              <input id="dirContent" required placeholder="نص التنبيه للطلاب..." class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
              <button type="submit" class="h-10 px-4 rounded-lg bg-teal-700 text-white text-xs font-bold">نشر التنبيه</button>
            </form>
            <div class="divide-y divide-slate-200">
              ${state.data.directives.map((d) => `
                <div class="py-3">
                  <div class="font-bold text-sm">${esc(d.title)}</div>
                  <div class="text-xs text-slate-500">${esc(d.issuedByName)}</div>
                  <p class="text-sm text-slate-700 mt-1">${esc(d.content)}</p>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderReports() {
      const students = state.data.users.filter((u) => u.role === 'member');
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold">التقارير والمتابعة</h2>
              <p class="text-sm text-slate-500">أداء الطلاب مع الإرسال المباشر عبر واتساب، والنشاط الأول والثاني والانضباط</p>
            </div>
            <div class="flex gap-1 p-1 bg-slate-200/70 rounded-lg text-xs font-semibold">
              <button onclick="setReportTab('students')" class="px-3 py-1.5 rounded-md ${state.reportTab === 'students' ? 'bg-white text-slate-900' : 'text-slate-600'}">أداء الطلاب (${students.length})</button>
              <button onclick="setReportTab('activity_1')" class="px-3 py-1.5 rounded-md ${state.reportTab === 'activity_1' ? 'bg-white text-slate-900' : 'text-slate-600'}">النشاط الأول</button>
              <button onclick="setReportTab('activity_2')" class="px-3 py-1.5 rounded-md ${state.reportTab === 'activity_2' ? 'bg-white text-slate-900' : 'text-slate-600'}">النشاط الثاني</button>
              <button onclick="setReportTab('discipline')" class="px-3 py-1.5 rounded-md ${state.reportTab === 'discipline' ? 'bg-white text-slate-900' : 'text-slate-600'}">الضباط والانضباط</button>
            </div>
          </div>

          ${state.reportTab === 'students' ? `
            <section class="bg-white border border-slate-200 rounded-xl overflow-hidden">
              ${students.length === 0 ? `<div class="p-10 text-center text-sm text-slate-500">لا يوجد طلاب مسجلون بعد. أضف الطلاب من قسم الأفراد والصلاحيات.</div>` : `
                <div class="overflow-x-auto">
                  <table class="w-full text-right text-sm">
                    <thead class="bg-slate-50 text-xs text-slate-500 border-b border-slate-200">
                      <tr><th class="py-3 px-4">الطالب</th><th class="py-3 px-4">القسم</th><th class="py-3 px-4">الصف</th><th class="py-3 px-4">الجوال</th><th class="py-3 px-4">النقاط</th><th class="py-3 px-4">واتساب</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                      ${students.map((st) => `
                        <tr>
                          <td class="py-3 px-4 font-semibold">${esc(st.fullName)}</td>
                          <td class="py-3 px-4 text-xs text-slate-600">${esc(UNIT_LABELS[st.unit] || st.unit)}</td>
                          <td class="py-3 px-4 text-xs text-slate-600">${esc(st.gradeOrDept || '—')}</td>
                          <td class="py-3 px-4 text-xs font-mono tabular-nums">${esc(st.phone)}</td>
                          <td class="py-3 px-4 font-mono tabular-nums font-bold text-teal-700">${st.points}</td>
                          <td class="py-3 px-4">
                            <a href="${waUrl(st)}" target="_blank" rel="noopener noreferrer" class="inline-block px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold">إرسال الأداء واتساب</a>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </section>
          ` : ''}

          ${(state.reportTab === 'activity_1' || state.reportTab === 'activity_2') ? `
            <section class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
              <h3 class="font-bold text-base">${state.reportTab === 'activity_1' ? 'برامج النشاط الأول' : 'برامج النشاط الثاني'}</h3>
              <form onsubmit="createActivity(event, '${state.reportTab}')" class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                <input id="actTitle" required placeholder="عنوان البرنامج" class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
                <input id="actCat" placeholder="المجال (ثقافي/رياضي)" class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
                <input id="actDate" type="date" required value="2026-11-25" class="h-10 px-3 rounded-lg border border-slate-300 text-sm font-mono" />
                <button type="submit" class="h-10 px-4 rounded-lg bg-teal-700 text-white text-xs font-bold">إضافة برنامج</button>
              </form>
              <div class="divide-y divide-slate-200">
                ${state.data.activities.filter((a) => a.unit === state.reportTab).map((a) => `
                  <div class="py-3 flex justify-between items-center">
                    <div>
                      <div class="font-bold text-sm">${esc(a.title)}</div>
                      <div class="text-xs text-slate-500">${esc(a.category)} · ${esc(a.eventDate)} · ${esc(a.location)}</div>
                    </div>
                    <span class="text-xs font-semibold text-emerald-700">معتمد</span>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          ${state.reportTab === 'discipline' ? `
            <section class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
              <h3 class="font-bold text-base">سجل الضباط والانضباط والنقاط</h3>
              ${students.length === 0 ? `<p class="text-sm text-slate-500">أضف طلاباً أولاً لتسجيل ملاحظات الانضباط.</p>` : `
                <form onsubmit="createDiscipline(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                  <select id="disUser" required class="h-10 px-3 rounded-lg border border-slate-300 text-sm bg-white">
                    ${students.map((s) => `<option value="${s.id}">${esc(s.fullName)}</option>`).join('')}
                  </select>
                  <input id="disDelta" type="number" required value="5" class="h-10 px-3 rounded-lg border border-slate-300 text-sm font-mono" placeholder="النقاط (+/-)" />
                  <input id="disNote" required placeholder="سبب التقييم أو المخالفة" class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
                  <button type="submit" class="h-10 px-4 rounded-lg bg-slate-900 text-white text-xs font-bold">حفظ السجل</button>
                </form>
              `}
              <div class="divide-y divide-slate-200">
                ${state.data.disciplineLogs.map((l) => `
                  <div class="py-3 flex justify-between text-sm">
                    <div><span class="font-bold">${esc(l.userName)}</span> — ${esc(l.note)}</div>
                    <span class="font-mono font-bold ${l.pointsDelta >= 0 ? 'text-emerald-700' : 'text-red-700'}">${l.pointsDelta >= 0 ? '+' + l.pointsDelta : l.pointsDelta}</span>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}
        </div>
      `;
    }

    function renderBroadcasts() {
      const sel = state.data.broadcasts.find((b) => b.id === state.selectedBroadcastId) || state.data.broadcasts[0];
      const canAdd = isMgmt(state.user.role) || state.user.unit === 'broadcast';
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3 no-print">
            <div>
              <h2 class="text-xl font-bold">الإذاعة المدرسية</h2>
              <p class="text-sm text-slate-500">جدول الإذاعات الصباحية والفقرات</p>
            </div>
            ${sel ? `<button onclick="window.print()" class="px-4 py-2 rounded-lg border border-slate-300 bg-white text-xs font-bold">طباعة النص</button>` : ''}
          </div>
          ${canAdd ? `
            <form onsubmit="createBroadcast(event)" class="bg-white border border-slate-200 rounded-xl p-5 grid grid-cols-1 sm:grid-cols-5 gap-2 no-print">
              <input id="brcTitle" required placeholder="عنوان الإذاعة" class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
              <input id="brcDate" type="date" required value="2026-11-23" class="h-10 px-3 rounded-lg border border-slate-300 text-sm font-mono" />
              <input id="brcTime" type="time" required value="07:15" class="h-10 px-3 rounded-lg border border-slate-300 text-sm font-mono" />
              <input id="brcWord" placeholder="كلمة الصباح" class="h-10 px-3 rounded-lg border border-slate-300 text-sm" />
              <button type="submit" class="h-10 px-4 rounded-lg bg-teal-700 text-white text-xs font-bold">إضافة إذاعة</button>
            </form>
          ` : ''}
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 bg-white border border-slate-200 rounded-xl divide-y divide-slate-200 no-print">
              ${state.data.broadcasts.map((b) => `
                <button onclick="selectBroadcast(${b.id})" class="w-full text-right p-4 ${sel && sel.id === b.id ? 'bg-teal-50' : 'hover:bg-slate-50'}">
                  <div class="font-bold text-sm">${esc(b.title)}</div>
                  <div class="text-xs text-slate-500 mt-1 font-mono">${esc(b.airDate)} · ${esc(b.airTime)} · <span class="${(BRC_STATUS[b.status] || BRC_STATUS.approved)[1]}">${(BRC_STATUS[b.status] || BRC_STATUS.approved)[0]}</span></div>
                </button>
              `).join('')}
            </div>
            <div class="lg:col-span-8 bg-white border border-slate-200 rounded-xl p-6 space-y-4">
              ${sel ? `
                <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                  <div>
                    <h3 class="text-lg font-bold">${esc(sel.title)}</h3>
                    <div class="text-xs text-slate-500 font-mono">${esc(sel.airDate)} · ${esc(sel.airTime)}</div>
                  </div>
                  ${isMgmt(state.user.role) && sel.status === 'pending_approval' ? `<button onclick="approveBroadcast(${sel.id})" class="px-3 py-1.5 rounded-lg bg-teal-700 text-white text-xs font-bold no-print">اعتماد البث</button>` : ''}
                </div>
                <div class="space-y-3 text-sm">
                  <div><div class="text-xs font-bold text-teal-800">1. المقدمة</div><p>${esc(sel.segments?.intro)}</p></div>
                  <div><div class="text-xs font-bold text-teal-800">2. القرآن الكريم</div><p>${esc(sel.segments?.quran)}</p></div>
                  <div><div class="text-xs font-bold text-teal-800">3. الحديث الشريف</div><p>${esc(sel.segments?.hadith)}</p></div>
                  <div><div class="text-xs font-bold text-teal-800">4. كلمة الصباح</div><p>${esc(sel.segments?.morningWord)}</p></div>
                  <div><div class="text-xs font-bold text-teal-800">5. هل تعلم</div><p>${esc(sel.segments?.didYouKnow)}</p></div>
                  <div><div class="text-xs font-bold text-teal-800">6. الخاتمة</div><p>${esc(sel.segments?.closing)}</p></div>
                </div>
              ` : `<p class="text-sm text-slate-500">لا توجد إذاعات</p>`}
            </div>
          </div>
        </div>
      `;
    }

    function renderDirectory() {
      const isTop = state.user.role === 'president' || state.user.role === 'vice_president';
      const isPres = state.user.role === 'president';
      const genCode = Math.floor(100000 + Math.random() * 900000);
      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-bold">الأفراد والصلاحيات</h2>

    function renderSubmissionsAdmin() {

          ` : ''}

          ${state.subTab === 'complaints' ? `
            <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200">
              ${state.data.complaints.length === 0 ? `<div class="p-10 text-center text-sm text-slate-500">لا توجد شكاوى</div>` : state.data.complaints.map((c) => `
                <div class="p-5 flex flex-col lg:flex-row justify-between gap-4">
                  <div>
                    <div class="font-bold">شكوى على: ${esc(c.targetStudentName)} · <span class="text-xs ${(CMP_STATUS[c.status] || CMP_STATUS.new)[1]}">${(CMP_STATUS[c.status] || CMP_STATUS.new)[0]}</span></div>

          ${state.subTab === 'suggestions' ? `
            <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200">
              ${state.data.suggestions.length === 0 ? `<div class="p-10 text-center text-sm text-slate-500">لا توجد اقتراحات</div>` : state.data.suggestions.map((g) => `
                <div class="p-5 flex flex-col lg:flex-row justify-between gap-4">
                  <div>
                    <div class="font-bold">${esc(g.title)} · <span class="text-xs ${(SUG_STATUS[g.status] || SUG_STATUS.new)[1]}">${(SUG_STATUS[g.status] || SUG_STATUS.new)[0]}</span></div>
                    <div class="text-xs text-slate-500 mt-1">من الطالب: ${esc(g.studentName)}</div>
                    ${g.details ? `<p class="text-sm text-slate-700 mt-2">${esc(g.details)}</p>` : ''}
                  </div>
                  <div class="flex items-center gap-2">
                    <input id="sug-${g.id}" value="${esc(g.adminResponse || '')}" placeholder="رد الإدارة" class="h-9 px-3 rounded-lg border border-slate-300 text-xs" />
                    <button onclick="replySuggestion(${g.id}, 'adopted')" class="px-3 py-2 rounded-lg bg-teal-700 text-white text-xs font-bold">اعتماد الاقتراح</button>
                  </div>

          ` : ''}
        </div>

    function renderStudentPortal() {
      const mySubs = state.data.submissions;
      const approvedCnt = mySubs.filter((s) => s.status === 'approved').length;
      const pendingCnt = mySubs.filter((s) => s.status === 'pending').length;

      if (state.tab === 'member_stats') {
        return `
          <div class="space-y-6">
            <div><h2 class="text-xl font-bold">إحصائياتي — أهلاً يا ${esc(state.user.fullName)}</h2><p class="text-sm text-slate-500">${esc(state.user.gradeOrDept || '')} · ${esc(UNIT_LABELS[state.user.unit] || '')}</p></div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-white border border-slate-200 rounded-xl p-5"><div class="text-xs text-slate-500">مجموع نقاطي</div><div class="text-3xl font-bold text-teal-700 font-mono tabular-nums mt-2">${state.user.points}</div></div>
              <div class="bg-white border border-slate-200 rounded-xl p-5"><div class="text-xs text-slate-500">إنجازات مقبولة</div><div class="text-3xl font-bold text-emerald-700 font-mono tabular-nums mt-2">${approvedCnt}</div></div>
              <div class="bg-white border border-slate-200 rounded-xl p-5"><div class="text-xs text-slate-500">بانتظار الإدارة</div><div class="text-3xl font-bold text-amber-700 font-mono tabular-nums mt-2">${pendingCnt}</div></div>
            </div>
            <section class="bg-white border border-slate-200 rounded-xl p-6 space-y-3">
              <h3 class="font-bold">تنبيهات الإدارة</h3>
              ${state.data.directives.map((d) => `<div class="border-t border-slate-100 pt-2"><div class="font-semibold text-sm">${esc(d.title)}</div><p class="text-sm text-slate-600">${esc(d.content)}</p></div>`).join('')}
            </section>
          </div>
        `;
      }

      if (state.tab === 'member_achievements') {
        return `
          <div class="space-y-6">
            <div><h2 class="text-xl font-bold">تقديم إنجاز</h2><p class="text-sm text-slate-500">اكتب الإنجاز الذي قمت به ليراجعه الرئيس أو النائب ويمنحك النقاط</p></div>
            <form onsubmit="submitAchievement(event)" class="bg-white border border-slate-200 rounded-xl p-6 space-y-3 max-w-2xl">
              <input id="achTitle" required placeholder="ماذا أنجزت؟ (مثال: المشاركة في تنظيم الطابور)" class="w-full h-11 px-3 rounded-lg border border-slate-300 text-sm" />
              <textarea id="achDetails" rows="3" placeholder="تفاصيل الإنجاز (اختياري)" class="w-full p-3 rounded-lg border border-slate-300 text-sm"></textarea>
              <button type="submit" class="px-5 py-2.5 rounded-lg bg-teal-700 text-white text-xs font-bold">رفع الإنجاز للإدارة</button>
            </form>
            <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200">
              ${mySubs.length === 0 ? `<div class="p-8 text-center text-sm text-slate-500">لم ترفع إنجازات بعد</div>` : mySubs.map((s) => `
                <div class="p-4 flex justify-between items-center">
                  <div><div class="font-bold text-sm">${esc(s.title)}</div>${s.adminNote ? `<div class="text-xs text-slate-500 mt-0.5">رد الإدارة: ${esc(s.adminNote)}</div>` : ''}</div>
                  <div class="text-xs font-bold ${(SUB_STATUS[s.status] || SUB_STATUS.pending)[1]}">${(SUB_STATUS[s.status] || SUB_STATUS.pending)[0]}${s.status === 'approved' ? ` (+${s.awardedPoints} نقطة)` : ''}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (state.tab === 'member_complaints') {
        return `
          <div class="space-y-6">
            <div><h2 class="text-xl font-bold">تقديم شكوى</h2><p class="text-sm text-slate-500">تصل الشكوى للإدارة فقط بسرية تامة</p></div>
            <form onsubmit="submitComplaint(event)" class="bg-white border border-slate-200 rounded-xl p-6 space-y-3 max-w-2xl">
              <input id="cmpTarget" required placeholder="اسم الطالب المشكو عليه" class="w-full h-11 px-3 rounded-lg border border-slate-300 text-sm" />
              <input id="cmpReason" required placeholder="سبب الشكوى" class="w-full h-11 px-3 rounded-lg border border-slate-300 text-sm" />
              <textarea id="cmpDetails" rows="3" placeholder="تفاصيل إضافية" class="w-full p-3 rounded-lg border border-slate-300 text-sm"></textarea>
              <button type="submit" class="px-5 py-2.5 rounded-lg bg-slate-900 text-white text-xs font-bold">إرسال الشكوى للإدارة</button>
            </form>
            <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200">
              ${state.data.complaints.map((c) => `
                <div class="p-4 flex justify-between items-center">
                  <div><div class="font-bold text-sm">على: ${esc(c.targetStudentName)} — ${esc(c.reason)}</div>${c.adminResponse ? `<div class="text-xs text-teal-700 mt-0.5">رد الإدارة: ${esc(c.adminResponse)}</div>` : ''}</div>
                  <span class="text-xs font-bold ${(CMP_STATUS[c.status] || CMP_STATUS.new)[1]}">${(CMP_STATUS[c.status] || CMP_STATUS.new)[0]}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-6">
          <div><h2 class="text-xl font-bold">الاقتراحات</h2><p class="text-sm text-slate-500">شاركنا أفكارك واقتراحاتك لتطوير الأنشطة</p></div>
          <form onsubmit="submitSuggestion(event)" class="bg-white border border-slate-200 rounded-xl p-6 space-y-3 max-w-2xl">
            <input id="sugTitle" required placeholder="فكرة الاقتراح" class="w-full h-11 px-3 rounded-lg border border-slate-300 text-sm" />
            <textarea id="sugDetails" rows="3" placeholder="شرح بسيط للفكرة" class="w-full p-3 rounded-lg border border-slate-300 text-sm"></textarea>
            <button type="submit" class="px-5 py-2.5 rounded-lg bg-teal-700 text-white text-xs font-bold">إرسال الاقتراح</button>
          </form>
          <div class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-200">
            ${state.data.suggestions.map((g) => `
              <div class="p-4 flex justify-between items-center">
                <div><div class="font-bold text-sm">${esc(g.title)}</div>${g.adminResponse ? `<div class="text-xs text-teal-700 mt-0.5">رد الإدارة: ${esc(g.adminResponse)}</div>` : ''}</div>
                <span class="text-xs font-bold ${(SUG_STATUS[g.status] || SUG_STATUS.new)[1]}">${(SUG_STATUS[g.status] || SUG_STATUS.new)[0]}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!state.user) {
        root.innerHTML = renderLogin();
        return;
      }
      const nav = navItemsFor(state.user);
      let body = '';
      if (state.tab === 'overview') body = renderOverview();
      else if (state.tab === 'reports') body = renderReports();
      else if (state.tab === 'broadcasts') body = renderBroadcasts();
      else if (state.tab === 'directory') body = renderDirectory();
      else if (state.tab === 'submissions') body = renderSubmissionsAdmin();
      else body = renderStudentPortal();

      root.innerHTML = `
        <div class="min-h-screen flex">
          <aside class="hidden lg:flex w-64 shrink-0 bg-slate-950 text-white flex-col no-print">
            <div class="p-5 border-b border-slate-800">
              <div class="text-xs text-teal-400 font-bold">منظومة النشاط الطلابي</div>
              <div class="font-bold text-sm mt-1">${esc(state.user.fullName)}</div>
              <div class="text-xs text-slate-400">${esc(ROLE_LABELS[state.user.role])}</div>
            </div>
            <nav class="flex-1 p-3 space-y-1">
              ${nav.map((n) => `
                <button onclick="setTab('${n.id}')" class="w-full text-right px-3 py-2.5 rounded-lg text-sm font-semibold ${state.tab === n.id ? 'bg-teal-700 text-white' : 'text-slate-300 hover:bg-slate-900'}">${esc(n.label)}</button>
              `).join('')}
            </nav>
            <div class="p-4 border-t border-slate-800">
              <button onclick="logout()" class="w-full py-2 rounded-lg border border-slate-700 text-xs font-bold text-slate-300 hover:bg-slate-900">تسجيل الخروج</button>
            </div>
          </aside>
          <div class="flex-1 min-w-0 flex flex-col">
            <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between gap-2 no-print">
              <div class="flex lg:hidden gap-1 overflow-x-auto">
                ${nav.map((n) => `<button onclick="setTab('${n.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${state.tab === n.id ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-700'}">${esc(n.label)}</button>`).join('')}
              </div>
              <div class="hidden lg:block text-sm font-bold text-slate-700">${esc((nav.find((n) => n.id === state.tab) || {}).label || '')}</div>
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="refreshWorkspace()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold">تحديث</button>
                <button onclick="logout()" class="lg:hidden px-3 py-1.5 rounded-lg border border-red-200 text-red-700 text-xs font-semibold">خروج</button>
              </div>
            </header>
            <main class="flex-1 p-4 sm:p-6 max-w-6xl w-full mx-auto space-y-4">
              ${state.error ? `<div class="p-3 rounded-lg bg-red-50 border border-red-200 text-xs font-bold text-red-700">${esc(state.error)}</div>` : ''}
              ${state.okMsg ? `<div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-700">${esc(state.okMsg)}</div>` : ''}
              ${body}
            </main>
          </div>
        </div>
      `;
    }

    window.setPortal = (p) => { state.portalType = p; state.error = ''; render(); };
    window.setTab = (t) => { state.tab = t; state.error = ''; state.okMsg = ''; render(); };
    window.setReportTab = (t) => { state.reportTab = t; render(); };
    window.setSubTab = (t) => { state.subTab = t; render(); };
    window.selectBroadcast = (id) => { state.selectedBroadcastId = id; render(); };
    window.logout = () => { setToken(''); state.user = null; state.error = ''; state.okMsg = ''; render(); };

    window.submitLogin = async (e) => {
      e.preventDefault();
      state.error = '';
      try {
        const code = document.getElementById('loginCodeInput').value;
        const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ code, portalType: state.portalType }) });
        setToken(res.token);
        state.user = res.user;
        state.tab = isMgmt(res.user.role) ? 'overview' : 'member_stats';
        await refreshWorkspace();
      } catch (err) {
        state.error = err.message;
        render();
      }
    };

    async function runAction(fn, okText) {
      state.error = '';
      state.okMsg = '';
      try {
        await fn();
        if (okText) state.okMsg = okText;
        await refreshWorkspace();
      } catch (err) {
        state.error = err.message;
        render();
      }
    }

    window.createUser = (e) => {
      e.preventDefault();
      const body = {
        fullName: document.getElementById('uName').value,
        phone: document.getElementById('uPhone').value,
        loginCode: document.getElementById('uCode').value,
        role: document.getElementById('uRole').value,
        unit: document.getElementById('uUnit').value,
        gradeOrDept: document.getElementById('uGrade').value,
      };
      runAction(() => api('/api/users', { method: 'POST', body: JSON.stringify(body) }), 'تمت إضافة الحساب بنجاح');
    };
    window.changeUserRole = (id, role) => runAction(() => api('/api/users/' + id, { method: 'PATCH', body: JSON.stringify({ role }) }), 'تم تحديث الصفة');
    window.toggleActive = (id, isActive) => runAction(() => api('/api/users/' + id, { method: 'PATCH', body: JSON.stringify({ isActive }) }));
    window.deleteUser = (id) => runAction(() => api('/api/users/' + id, { method: 'DELETE' }), 'تم الحذف');
    window.createDirective = (e) => {
      e.preventDefault();
      runAction(() => api('/api/directives', { method: 'POST', body: JSON.stringify({ title: document.getElementById('dirTitle').value, content: document.getElementById('dirContent').value }) }), 'تم نشر التنبيه');
    };
    window.createActivity = (e, unit) => {
      e.preventDefault();
      runAction(() => api('/api/activities', { method: 'POST', body: JSON.stringify({ title: document.getElementById('actTitle').value, category: document.getElementById('actCat').value, eventDate: document.getElementById('actDate').value, unit }) }), 'تمت إضافة البرنامج');
    };
    window.createDiscipline = (e) => {
      e.preventDefault();
      runAction(() => api('/api/discipline', { method: 'POST', body: JSON.stringify({ userId: Number(document.getElementById('disUser').value), pointsDelta: Number(document.getElementById('disDelta').value), note: document.getElementById('disNote').value }) }), 'تم تسجيل الملاحظة');
    };
    window.createBroadcast = (e) => {
      e.preventDefault();
      runAction(() => api('/api/broadcasts', { method: 'POST', body: JSON.stringify({ title: document.getElementById('brcTitle').value, airDate: document.getElementById('brcDate').value, airTime: document.getElementById('brcTime').value, segments: { morningWord: document.getElementById('brcWord').value } }) }), 'تم حفظ الإذاعة');
    };
    window.approveBroadcast = (id) => runAction(() => api('/api/broadcasts/' + id, { method: 'PATCH', body: JSON.stringify({ status: 'approved' }) }), 'تم اعتماد البث');
    window.reviewSub = (id, decision) => {
      const awardedPoints = Number(document.getElementById('pts-' + id).value || 0);
      const adminNote = document.getElementById('note-' + id).value;
      runAction(() => api('/api/submissions/' + id, { method: 'PATCH', body: JSON.stringify({ decision, awardedPoints, adminNote }) }), decision === 'approved' ? 'تم القبول وإضافة النقاط' : 'تم الرفض');
    };
    window.replyComplaint = (id) => runAction(() => api('/api/complaints/' + id, { method: 'PATCH', body: JSON.stringify({ status: 'resolved', adminResponse: document.getElementById('cmp-' + id).value }) }), 'تم تحديث الشكوى');
    window.replySuggestion = (id, status) => runAction(() => api('/api/suggestions/' + id, { method: 'PATCH', body: JSON.stringify({ status, adminResponse: document.getElementById('sug-' + id).value }) }), 'تم اعتماد الاقتراح');
    window.submitAchievement = (e) => {
      e.preventDefault();
      runAction(() => api('/api/submissions', { method: 'POST', body: JSON.stringify({ title: document.getElementById('achTitle').value, details: document.getElementById('achDetails').value }) }), 'تم رفع الإنجاز للإدارة');
    };
    window.submitComplaint = (e) => {
      e.preventDefault();
      runAction(() => api('/api/complaints', { method: 'POST', body: JSON.stringify({ targetStudentName: document.getElementById('cmpTarget').value, reason: document.getElementById('cmpReason').value, details: document.getElementById('cmpDetails').value }) }), 'تم إرسال الشكوى');
    };
    window.submitSuggestion = (e) => {
      e.preventDefault();
      runAction(() => api('/api/suggestions', { method: 'POST', body: JSON.stringify({ title: document.getElementById('sugTitle').value, details: document.getElementById('sugDetails').value }) }), 'تم إرسال الاقتراح');
    };

    if (getToken()) refreshWorkspace();
    else render();
  </script>
</body>
</html>
