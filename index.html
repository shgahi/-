<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منظومة النشاط الطلابي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "IBM Plex Sans Arabic", "Cairo", sans-serif; background-color: #f5f7fa; }
    h1, h2, h3, h4 { font-family: "Cairo", "IBM Plex Sans Arabic", sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .report-kufi-font { font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", sans-serif !important; }
    .english-date-font { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif !important; }
    @keyframes sectionEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalEnter {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes backdropEnter {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-section-enter { animation: sectionEnter 320ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-modal-enter { animation: modalEnter 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-backdrop-enter { animation: backdropEnter 200ms ease-out both; }
    .luxury-card {
      background-color: #ffffff;
      border: 1px solid rgba(203, 213, 225, 0.72);
      border-radius: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px -8px rgba(15, 23, 42, 0.05);
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 220ms cubic-bezier(0.16, 1, 0.3, 1), border-color 220ms ease;
    }
    .luxury-card-interactive:hover {
      transform: translateY(-2px);
      border-color: rgba(15, 118, 110, 0.28);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), 0 16px 32px -12px rgba(15, 118, 110, 0.10);
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-section-enter, .animate-modal-enter, .animate-backdrop-enter, .luxury-card {
        animation: none !important; transition: none !important; transform: none !important;
      }
    }
    @media print {
      @page { size: A4 portrait; margin: 5mm; }
      html, body { background-color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      .print-sheet { border: none !important; box-shadow: none !important; margin: 0 auto !important; max-width: 100% !important; width: 100% !important; border-radius: 0 !important; break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-[#f5f7fa] text-slate-900 min-h-screen antialiased">
  <div id="app"></div>
  <div id="modal-root"></div>

  <script>
    const TOKEN_KEY = 'activity_sys_token';
    const ROLE_LABELS = { president: 'رئيس النشاط', vice_president: 'نائب الرئيس', officer: 'ضابط نشاط', member: 'فرد (طالب)' };
    const UNIT_LABELS = { command: 'القيادة العليا', officers: 'لجنة الضباط', activity_1: 'النشاط الأول', activity_2: 'النشاط الثاني', broadcast: 'الإذاعة المدرسية', general: 'النشاط العام', all: 'الجميع' };
    const SUB_STATUS = { pending: ['بانتظار الإدارة', 'text-amber-700'], approved: ['مقبول', 'text-emerald-700'], rejected: ['مرفوض', 'text-red-700'] };
    const CMP_STATUS = { new: ['جديدة', 'text-amber-700'], reviewing: ['قيد المتابعة', 'text-sky-700'], resolved: ['تمت المعالجة', 'text-emerald-700'] };
    const SUG_STATUS = { new: ['جديد', 'text-amber-700'], reviewed: ['تمت المراجعة', 'text-sky-700'], adopted: ['معتمد للتنفيذ', 'text-emerald-700'] };
    const BRC_STATUS = { pending_approval: ['بانتظار الاعتماد', 'text-amber-700'], approved: ['معتمدة للبث', 'text-emerald-700'], aired: ['تم البث', 'text-teal-700'], returned: ['معادة', 'text-red-700'] };

    const ALL_PERMS = [
      { key: 'manage_directory', label: 'إدارة الأفراد والصلاحيات', desc: 'إضافة وتعديل بيانات الطلاب ورموز الدخول' },
      { key: 'manage_broadcasts', label: 'إدارة الإذاعة المدرسية', desc: 'إعداد وتعديل وتوليد جدول ونصوص الإذاعة' },
      { key: 'manage_activities', label: 'إدارة الأنشطة والمهام', desc: 'إضافة البرامج وإسناد المهام للطلاب' },
      { key: 'manage_discipline', label: 'سجل الانضباط والنقاط', desc: 'تسجيل الحضور والتميز والمخالفات' },
      { key: 'review_submissions', label: 'مراجعة تقديمات الطلاب', desc: 'قبول الإنجازات والشكاوى والاقتراحات' },
      { key: 'issue_directives', label: 'إصدار التوجيهات والتنبيهات', desc: 'نشر وحذف التوجيهات الرسمية' },
    ];
    const DEFAULT_ROLE_PERMS = {
      president: ALL_PERMS.map((p) => p.key),
      vice_president: ALL_PERMS.map((p) => p.key),
      officer: ['manage_activities', 'manage_discipline', 'manage_broadcasts', 'review_submissions', 'issue_directives'],
      member: [],
    };

    let state = {
      user: null,
      portalType: 'management',
      tab: 'overview',
      reportTab: 'evidence',
      subTab: 'achievements',
      data: { users: [], activities: [], broadcasts: [], disciplineLogs: [], directives: [], submissions: [], complaints: [], suggestions: [], programReports: [] },
      selectedBroadcastId: null,
      inlineBroadcastEdit: false,
      selectedReportId: null,
      showReportBuilder: false,
      showRepAdvanced: false,
      editingReportId: null,
      reportDraft: {
        schoolName: 'مدرسة الحديبية المتوسطة',
        title: '',
        field: '',
        executors: '',
        executionDate: (() => { try { const pts = new Intl.DateTimeFormat('en-u-ca-islamic-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()); const y = pts.find(p => p.type === 'year')?.value; const m = pts.find(p => p.type === 'month')?.value; const d = pts.find(p => p.type === 'day')?.value; return (y && m && d) ? `${y}/${m}/${d}هـ`.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)) : new Date().toISOString().slice(0, 10); } catch { return new Date().toISOString().slice(0, 10); } })(),
        beneficiaries: 'الطلاب',
        beneficiariesCount: '',
        stepsText: '',
        objectivesText: '',
        images: [],
      },
      editingUserId: null,
      editingBroadcastId: null,
      confirmOpts: null,
      error: '',
      okMsg: '',
      loading: false,
    };

    let confirmResolver = null;
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const isMgmt = (r) => ['president', 'vice_president', 'officer'].includes(r);
    const isSupreme = (u) => Boolean(u && u.username === 'president');
    const effectivePerms = (u) => isSupreme(u) ? ALL_PERMS.map((p) => p.key) : (Array.isArray(u?.permissions) ? u.permissions : (DEFAULT_ROLE_PERMS[u?.role] || []));
    const hasPerm = (u, perm) => effectivePerms(u).includes(perm);
    const hasAllSixPerms = (u) => Boolean(u) && (isSupreme(u) || ALL_PERMS.every((p) => hasPerm(u, p.key)));
    const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
    const setToken = (t) => t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY);

    function openConfirm(opts) {
      return new Promise((resolve) => {
        confirmResolver = resolve;
        state.confirmOpts = opts;
        renderModalRoot();
      });
    }
    window.resolveConfirm = (accepted) => {
      const r = confirmResolver;
      confirmResolver = null;
      state.confirmOpts = null;
      renderModalRoot();
      if (r) r(Boolean(accepted));
    };

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const t = getToken();
      if (t) headers.Authorization = 'Bearer ' + t;
      const res = await fetch(path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'حدث خطأ غير متوقع');
      return data;
    }

    function waUrl(student) {
      let digits = String(student.phone || '').replace(/\D/g, '');
      if (digits.startsWith('05') && digits.length === 10) digits = '966' + digits.slice(1);
      else if (digits.startsWith('5') && digits.length === 9) digits = '966' + digits;
      const approved = state.data.submissions.filter((s) => s.studentId === student.id && s.status === 'approved').length;
      const lines = [
        'السلام عليكم ورحمة الله وبركاته',
        'تقرير أداء الطالب في النشاط الطلابي:',
        'الاسم: ' + student.fullName,
        'القسم: ' + (UNIT_LABELS[student.unit] || student.unit),
        student.gradeOrDept ? 'الصف: ' + student.gradeOrDept : '',
        'مجموع النقاط: ' + (student.points || 0) + ' نقطة',
        'الإنجازات المقبولة: ' + approved,
      ].filter(Boolean).join('\n');
      return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(lines);
    }

    async function refreshWorkspace() {
      state.loading = true;
      render();
      try {
        const [me, ws] = await Promise.all([api('/api/auth/me'), api('/api/workspace')]);
        state.user = me.user;
        state.data = ws;
        if (state.tab === 'directory' && !hasAllSixPerms(state.user)) state.tab = isMgmt(state.user.role) ? 'overview' : 'member_stats';
        if (state.tab === 'broadcasts' && !hasPerm(state.user, 'manage_broadcasts')) state.tab = isMgmt(state.user.role) ? 'overview' : 'member_stats';
        if (!state.selectedBroadcastId && ws.broadcasts[0]) state.selectedBroadcastId = ws.broadcasts[0].id;
        if (!state.selectedReportId && ws.programReports && ws.programReports[0]) state.selectedReportId = ws.programReports[0].id;
        if (!state.reportDraft.executors && state.user) state.reportDraft.executors = state.user.fullName;
      } catch (e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-[#0b1618] relative overflow-hidden">
          <div class="w-full max-w-md luxury-card p-8 space-y-6 animate-section-enter relative z-10">
            <div>
              <p class="text-xs font-bold text-teal-800">بوابة النشاط الطلابي</p>
              <h1 class="text-2xl font-bold text-slate-900 mt-1">تسجيل الدخول بالرمز</h1>
              <p class="text-sm text-slate-500 mt-1">اختر بوابة الدخول ثم أدخل الرمز السري المخصص لك</p>
            </div>
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">
              <button onclick="setPortal('management')" class="py-2 rounded-lg text-xs font-bold transition-all ${state.portalType === 'management' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">دخول الإدارة</button>
              <button onclick="setPortal('member')" class="py-2 rounded-lg text-xs font-bold transition-all ${state.portalType === 'member' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">دخول الأفراد (الطلاب)</button>
            </div>
            ${state.error ? `<div class="p-3 rounded-xl bg-red-50 border border-red-200 text-xs font-semibold text-red-700">${esc(state.error)}</div>` : ''}
            <form onsubmit="submitLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">رمز الدخول</label>
                <input id="loginCodeInput" type="password" inputmode="numeric" required placeholder="أدخل الرمز المكون من 6 أرقام" class="w-full h-11 px-4 rounded-xl border border-slate-300 text-center font-mono text-base tracking-widest focus:outline-none focus:border-teal-800" />
              </div>
              <button type="submit" class="w-full h-11 rounded-xl bg-teal-800 hover:bg-teal-900 text-white text-sm font-bold shadow-xs transition-colors">دخول للمنظومة</button>
            </form>
            <p class="text-xs text-slate-500 border-t border-slate-200/80 pt-4">يتم إضافة حسابات الطلاب وإصدار رموزهم من قِبل الإدارة فقط.</p>
          </div>
        </div>
      `;
    }

    function navItemsFor(user) {
      const canSeeDir = hasAllSixPerms(user);
      const canSeeBrc = hasPerm(user, 'manage_broadcasts');
      if (isMgmt(user.role)) {
        return [
          { id: 'overview', label: 'لوحة القيادة' },
          { id: 'reports', label: 'التقارير' },
          ...(canSeeBrc ? [{ id: 'broadcasts', label: 'الإذاعة' }] : []),
          ...(canSeeDir ? [{ id: 'directory', label: 'الأفراد والصلاحيات' }] : []),
          { id: 'submissions', label: 'تقديم طلاب النشاط' },
        ];
      }
      return [
        { id: 'member_stats', label: 'إحصائياتي' },
        { id: 'member_achievements', label: 'تقديم إنجاز' },
        { id: 'member_complaints', label: 'تقديم شكوى' },
        { id: 'member_suggestions', label: 'الاقتراحات' },
        ...(canSeeBrc ? [{ id: 'broadcasts', label: 'الإذاعة' }] : []),
        ...(canSeeDir ? [{ id: 'directory', label: 'الأفراد والصلاحيات' }] : []),
      ];
    }

    function renderOverview() {
      const students = state.data.users.filter((u) => u.role === 'member');
      const pendingSub = state.data.submissions.filter((s) => s.status === 'pending').length;
      const openCmp = state.data.complaints.filter((c) => c.status !== 'resolved').length;
      const newSug = state.data.suggestions.filter((s) => s.status === 'new').length;
      const canSeeDir = hasAllSixPerms(state.user);
      const canSeeBrc = hasPerm(state.user, 'manage_broadcasts');
      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-bold">مرحباً، ${esc(state.user.fullName)}</h2>
            <p class="text-sm text-slate-500">${esc(ROLE_LABELS[state.user.role])} · ${esc(UNIT_LABELS[state.user.unit] || '')}</p>
          </div>
          <div class="grid grid-cols-2 ${canSeeBrc ? 'lg:grid-cols-4' : 'lg:grid-cols-3'} gap-4">
            ${canSeeDir ? `
              <button onclick="setTab('directory')" class="text-right luxury-card luxury-card-interactive p-5 cursor-pointer">
                <div class="text-xs text-slate-500">الطلاب المسجلون</div>
                <div class="text-2xl font-bold font-mono tabular-nums mt-2">${students.length}</div>
              </button>
            ` : `
              <div class="text-right luxury-card p-5">
                <div class="text-xs text-slate-500">الطلاب المسجلون</div>
                <div class="text-2xl font-bold font-mono tabular-nums mt-2">${students.length}</div>
              </div>
            `}
            <button onclick="setTab('submissions')" class="text-right luxury-card luxury-card-interactive p-5 cursor-pointer">
              <div class="text-xs text-slate-500">إنجازات بانتظار المراجعة</div>
              <div class="text-2xl font-bold text-amber-700 font-mono tabular-nums mt-2">${pendingSub}</div>
            </button>
            <button onclick="setTab('submissions')" class="text-right luxury-card luxury-card-interactive p-5 cursor-pointer">
              <div class="text-xs text-slate-500">شكاوى واقتراحات</div>
              <div class="text-2xl font-bold font-mono tabular-nums mt-2">${openCmp + newSug}</div>
            </button>
            ${canSeeBrc ? `
              <button onclick="setTab('broadcasts')" class="text-right luxury-card luxury-card-interactive p-5 cursor-pointer">
                <div class="text-xs text-slate-500">الإذاعات المدرسية</div>
                <div class="text-2xl font-bold font-mono tabular-nums mt-2">${state.data.broadcasts.length}</div>
              </button>
            ` : ''}
          </div>
          <section class="luxury-card p-6 space-y-4">
            <h3 class="text-base font-bold">التوجيهات والتنبيهات</h3>
            <form onsubmit="createDirective(event)" class="grid grid-cols-1 md:grid-cols-3 gap-2">
              <input id="dirTitle" required placeholder="عنوان التنبيه" class="h-10 px-3 rounded-xl border border-slate-300 text-sm" />
              <input id="dirContent" required placeholder="نص التنبيه للطلاب..." class="h-10 px-3 rounded-xl border border-slate-300 text-sm" />
              <button type="submit" class="h-10 px-4 rounded-xl bg-teal-800 hover:bg-teal-900 text-white text-xs font-bold cursor-pointer">نشر التنبيه</button>
            </form>
            <div class="divide-y divide-slate-200/70">
              ${state.data.directives.map((d) => `
                <div class="py-3.5 flex items-start justify-between gap-3">
                  <div>
                    <div class="font-bold text-sm">${esc(d.title)}</div>
                    <div class="text-xs text-slate-500 mt-0.5">${esc(d.issuedByName)}</div>
                    <p class="text-sm text-slate-700 mt-1">${esc(d.content)}</p>
                  </div>
                  <button onclick="deleteDirective(${d.id}, '${esc(d.title)}')" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs font-semibold text-red-700 hover:bg-red-50 shrink-0 cursor-pointer">حذف</button>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderReports() {
      const students = state.data.users.filter((u) => u.role === 'member');
      const reports = state.data.programReports || [];
      const selRep = reports.find((r) => r.id === state.selectedReportId) || reports[0] || null;
      const d = state.reportDraft;
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3 no-print">
            <div>
              <h2 class="text-xl font-bold">التقارير والمتابعة</h2>
              <p class="text-sm text-slate-500">تقارير البرامج بالشواهد المصورة، أداء الطلاب واتساب، والنشاط الأول والثاني والانضباط</p>
            </div>
            <div class="flex flex-wrap gap-1 p-1 bg-slate-200/75 rounded-xl text-xs font-semibold">
              <button onclick="setReportTab('evidence')" class="px-3 py-1.5 rounded-lg ${state.reportTab === 'evidence' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">تقارير الشواهد (${reports.length})</button>
              <button onclick="setReportTab('students')" class="px-3 py-1.5 rounded-lg ${state.reportTab === 'students' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">أداء الطلاب (${students.length})</button>
              <button onclick="setReportTab('activity_1')" class="px-3 py-1.5 rounded-lg ${state.reportTab === 'activity_1' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">النشاط الأول</button>
              <button onclick="setReportTab('activity_2')" class="px-3 py-1.5 rounded-lg ${state.reportTab === 'activity_2' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">النشاط الثاني</button>
              <button onclick="setReportTab('discipline')" class="px-3 py-1.5 rounded-lg ${state.reportTab === 'discipline' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}">الضباط والانضباط</button>
            </div>
          </div>

          ${state.reportTab === 'evidence' ? `
            <div class="space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-3 no-print">
                <p class="text-xs text-slate-500">أدخل اسم البرنامج والمنفذين والتاريخ وأرفق حتى 4 شواهد مصورة، ويتولى الذكاء الاصطناعي استنتاج المجال وخطوات التنفيذ والأهداف مباشرة.</p>
                <button onclick="toggleReportBuilder()" class="px-4 py-2 rounded-xl bg-teal-800 hover:bg-teal-900 text-white text-xs font-bold cursor-pointer">${state.showReportBuilder ? 'إغلاق النموذج' : 'إعداد تقرير جديد (4 شواهد)'}</button>
              </div>

              ${(state.showReportBuilder || reports.length === 0) ? `
                <form onsubmit="submitProgramReport(event)" class="luxury-card p-6 space-y-4 no-print">
                  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                    <h3 class="text-sm font-bold">${state.editingReportId ? 'تعديل التقرير والشواهد' : 'إنشاء تقرير برنامج جديد (4 شواهد)'}</h3>
                    <button type="button" onclick="generateReportDraft()" class="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer">توليد المجال والخطوات والأهداف بالذكاء الاصطناعي</button>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">اسم البرنامج *</label><input id="repTitle" required value="${esc(d.title)}" oninput="syncRepDraft('title', this.value)" placeholder="مثال: البراكين" class="w-full h-10 px-3 rounded-xl border border-slate-300 text-sm" /></div>
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">المنفذ / ين *</label><input id="repExec" required value="${esc(d.executors)}" oninput="syncRepDraft('executors', this.value)" placeholder="الأستاذ / ..." class="w-full h-10 px-3 rounded-xl border border-slate-300 text-sm" /></div>
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">تاريخ التنفيذ *</label><input id="repDate" required value="${esc(toEngDigits(d.executionDate))}" oninput="syncRepDraft('executionDate', this.value)" placeholder="1448/05/04هـ" class="w-full h-10 px-3 rounded-xl border border-slate-300 text-sm english-date-font" /></div>
                  </div>

    window.setPortal = (p) => { state.portalType = p; state.error = ''; render(); };

      state.tab = t; state.error = ''; state.okMsg = ''; render();

    window.selectBroadcast = (id) => { state.selectedBroadcastId = id; state.inlineBroadcastEdit = false; render(); };
    window.toggleInlineBroadcast = (on) => { state.inlineBroadcastEdit = on; render(); };
    function formatStudentLine(text) {
      const n = String(text || '').replace(/\r\n/g, '\n').trim();
      if (!n) return '';
      const s = n.replace(/(الطالب[^\n]*?(?:\.{2,}|\([^\)]*\)|\.|:))[ \t]+([^\n]+)/g, '$1\n\n$2');
      const ls = s.split('\n');
      const out = [];
      for (let i = 0; i < ls.length; i++) {
        out.push(ls[i]);
        if (/الطالب/.test(ls[i]) && i + 1 < ls.length && ls[i + 1].trim() !== '') out.push('');
      }
      return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

      ['inBIntro','inBQuran','inBHadith','inBWord','inBDyk','inBClose'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = formatStudentLine(el.value);
      });

      const files = Array.from(e.target.files || []);
      const remaining = Math.max(0, 4 - state.reportDraft.images.length);
      if (remaining === 0) {
        state.error = 'الحد الأقصى للشواهد هو 4 صور فقط كما في القالب الرسمي';
        render();
        return;
      }
      for (const f of files.slice(0, remaining)) {
        const dataUrl = await new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => {
            const img = new Image();
            img.onload = () => {
              const max = 960;
              let w = img.width, h = img.height;
              if (w > max || h > max) {
                if (w >= h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; }
              }
              const c = document.createElement('canvas'); c.width = w; c.height = h;
              const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
              resolve(c.toDataURL('image/jpeg', 0.8));
            };
            img.src = r.result;
          };
          r.readAsDataURL(f);
        });
        state.reportDraft.images.push(dataUrl);

      });

      runAction(() => api('/api/suggestions/' + id, { method: 'PATCH', body: JSON.stringify({ status, adminResponse: document.getElementById('sug-' + id).value }) }), 'تم اعتماد الاقتراح');
    };

    window.submitAchievement = async (e) => {
      e.preventDefault();
      const title = document.getElementById('achTitle').value;
      const details = document.getElementById('achDetails').value;
      const ok = await openConfirm({
        title: 'تأكيد رفع الإنجاز',
        message: 'هل تريد رفع هذا الإنجاز للإدارة لمراجعته؟',
        detail: title,
        confirmLabel: 'نعم، رفع الإنجاز',
      });
      if (!ok) return;
      runAction(() => api('/api/submissions', { method: 'POST', body: JSON.stringify({ title, details }) }), 'تم رفع الإنجاز للإدارة');
    };

    window.submitComplaint = async (e) => {
      e.preventDefault();
      const targetStudentName = document.getElementById('cmpTarget').value;
      const reason = document.getElementById('cmpReason').value;
      const details = document.getElementById('cmpDetails').value;
      const ok = await openConfirm({
        title: 'تأكيد إرسال الشكوى',
        message: 'هل أنت متأكد من إرسال هذه الشكوى للإدارة؟ ستصل بسرية للمراجعة.',
        detail: `الطالب: ${targetStudentName} · السبب: ${reason}`,
        confirmLabel: 'نعم، إرسال الشكوى',
        tone: 'amber',
      });
      if (!ok) return;
      runAction(() => api('/api/complaints', { method: 'POST', body: JSON.stringify({ targetStudentName, reason, details }) }), 'تم إرسال الشكوى');
    };

    window.submitSuggestion = async (e) => {
      e.preventDefault();
      const title = document.getElementById('sugTitle').value;
      const details = document.getElementById('sugDetails').value;
      const ok = await openConfirm({
        title: 'تأكيد تقديم الاقتراح',
        message: 'هل تريد تقديم هذا الاقتراح للإدارة للاطلاع عليه؟',
        detail: title,
        confirmLabel: 'نعم، تقديم الاقتراح',
      });
      if (!ok) return;
      runAction(() => api('/api/suggestions', { method: 'POST', body: JSON.stringify({ title, details }) }), 'تم إرسال الاقتراح');
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.confirmOpts) window.resolveConfirm(false);
    });

    if (getToken()) refreshWorkspace();
    else render();
  </script>
</body>
</html>
